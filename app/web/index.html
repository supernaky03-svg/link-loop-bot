<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>Link Loop Manager</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:light dark;--bg:var(--tg-theme-bg-color,#0b1220);--panel:var(--tg-theme-secondary-bg-color,#131e30);--panel2:var(--tg-theme-section-bg-color,#1b2940);--text:var(--tg-theme-text-color,#edf3fc);--muted:var(--tg-theme-hint-color,#a8b5c9);--line:var(--tg-theme-section-separator-color,#2c3b53);--accent:var(--tg-theme-button-color,#54a8ff);--danger:#ef646f;--ok:#39bd8a;--input:var(--tg-theme-secondary-bg-color,#0d1728)}
*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom));background:var(--bg);color:var(--text);font:15px/1.48 system-ui,-apple-system,sans-serif}main{width:min(920px,100%);margin:auto;padding:14px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:5px 0 16px}h1{font-size:21px;margin:0}h2{font-size:18px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}.muted,.hint{color:var(--muted);font-size:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 5px 20px #00000010}nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;position:sticky;top:0;z-index:5;background:var(--bg);padding:5px 0 12px}button,input,select,textarea{font:inherit}button{border:0;border-radius:11px;padding:11px 13px;background:var(--accent);color:var(--tg-theme-button-text-color,#061426);font-weight:650;cursor:pointer}button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}button.danger{background:#6a2933;color:#ffe8eb}button:disabled{opacity:.55;cursor:wait}nav button{font-size:12px;padding:10px 4px;white-space:nowrap}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;color:var(--text);background:var(--input);margin:5px 0 11px;outline:none}textarea{min-height:112px;resize:vertical}label{display:block;color:var(--muted);font-size:13px;margin-top:9px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--panel2);border-radius:12px;padding:12px;text-align:center}.stat strong{display:block;font-size:22px}.pill{display:inline-block;padding:3px 8px;border-radius:20px;background:var(--panel2);color:var(--muted);font-size:12px}.pill.ok{color:var(--ok)}.pill.bad{color:var(--danger)}.notice{padding:11px 13px;margin:12px 0;border-radius:11px;background:var(--panel2);color:var(--muted);white-space:pre-wrap}.notice.error{border:1px solid #883943;color:#ffdce0}.notice.success{border:1px solid #236c51;color:#b5f5d7}.channel{padding:10px 0;border-top:1px solid var(--line);font-size:13px}.hidden{display:none!important}.rowhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.user-row{border-top:1px solid var(--line);padding:13px 0}details{margin-top:12px}summary{cursor:pointer;color:var(--accent);font-weight:600}a{color:var(--accent)}.empty{padding:22px;text-align:center;color:var(--muted)}.loading{opacity:.7;pointer-events:none}
@media(max-width:520px){main{padding:11px}.grid{grid-template-columns:1fr}.stats strong{font-size:19px}nav button{font-size:11px;padding:9px 2px}.card{padding:13px}}
</style></head>
<body><main>
<header><div><h1>🔁 Link Loop</h1><div id="welcome" class="muted">Channel pair manager</div></div><span id="role" class="pill">USER</span></header>
<nav id="nav" class="hidden"><button class="secondary" data-tab="pairs">My Pairs</button><button class="secondary" data-tab="add">＋ Add</button><button class="secondary" data-tab="settings">Settings</button><button class="secondary hidden" id="admin-tab" data-tab="admin">Admin</button></nav>
<div id="notice" class="notice">Connecting securely to Telegram…</div><section id="view"></section>
</main>
<script>
(()=>{'use strict';
const tg=window.Telegram?.WebApp||null,state={data:null,tab:'pairs',busy:false};
const $=(s,r=document)=>r.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tr=(en,my)=>state.data?.profile.language==='my'?my:en;
function notice(message,kind=''){const el=$('#notice');el.textContent=message;el.className='notice '+kind}
async function api(path,options={}){if(!tg?.initData)throw new Error('Open this Mini App from the Telegram bot.');const r=await fetch(path,{...options,headers:{'Content-Type':'application/json','X-Telegram-Init-Data':tg.initData,...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.error||`Request failed (${r.status})`);return d}
function pairCard(p){const channels=p.channels.map(ch=>`<div class="channel"><b>${ch.order_no}. ${esc(ch.title)}</b> <span class="muted">(${esc(ch.chat_id)})</span><br><span class="${ch.bot_admin_ok?'pill ok':'pill bad'}">${ch.bot_admin_ok?'Bot can post':'Permission check needed'}</span></div>`).join('');const order=p.channels.map(ch=>ch.chat_id).join(',');return `<article class="card" data-pair="${p.pair_no}"><div class="rowhead"><h3>Pair ${p.pair_no}</h3><span class="pill ${p.is_paused?'bad':'ok'}">${p.is_paused?'Paused':'Active'}</span></div><p class="muted">${p.channels.length} channels · ${p.repost_style==='random'?'Always Random':'By Order'} · Movie Rule ${p.movie_rule?'ON':'OFF'}</p>${p.is_paused?`<div class="notice error">${esc(p.paused_reason||'This pair is paused. Check channel permissions.')}</div>`:''}<div class="actions"><button class="secondary" data-action="recheck" data-no="${p.pair_no}">Recheck permissions</button></div>${channels}<details><summary>Edit route and Movie Rule</summary><label>Repost style</label><select name="style"><option value="random" ${p.repost_style==='random'?'selected':''}>Always Random</option><option value="by_order" ${p.repost_style==='by_order'?'selected':''}>By Order</option></select><label>Channel order — enter channel IDs in desired order, separated by commas</label><input name="order" value="${esc(order)}"><label>Movie Rule</label><select name="movie"><option value="false" ${!p.movie_rule?'selected':''}>OFF</option><option value="true" ${p.movie_rule?'selected':''}>ON</option></select><div class="actions"><button data-action="save-pair" data-no="${p.pair_no}">Save changes</button><button class="danger" data-action="delete-pair" data-no="${p.pair_no}">Remove Pair</button></div></details></article>`}
function renderPairs(){const pairs=state.data.pairs||[];$('#view').innerHTML=`<h2>${tr('Your channel pairs','သင့် Channel Pair များ')}</h2><p class="muted">${tr('Changes are shared with the Telegram bot. Reposting continues in the bot worker.','ပြောင်းလဲမှုများကို Telegram Bot နှင့် တူညီစွာ အသုံးပြုမည်။ Repost ကို Bot က ဆက်လက်လုပ်ဆောင်ပါမည်။')}</p>${pairs.length?pairs.map(pairCard).join(''):'<div class="card empty">No active pairs yet. Use ＋ Add to create one.</div>'}`}
function renderAdd(){const p=state.data.profile;$('#view').innerHTML=`<div class="card"><h2>${tr('Create a Pair','Pair အသစ်ထည့်ရန်')}</h2><form id="add-form"><label>Pair number (blank = Auto)</label><input name="pair_no" inputmode="numeric" placeholder="Auto"><label>Repost style</label><select name="style"><option value="random">Always Random</option><option value="by_order">By Order</option></select><label>Channel links / IDs (comma-separated)</label><textarea name="channels" required placeholder="https://t.me/channelA, https://t.me/channelB"></textarea><div class="hint">${tr('Private channels need both invite link and numeric -100… ID, for example https://t.me/+invite(-1001234567890). Bot must be admin with Post Messages permission.','Private Channel အတွက် Invite Link နှင့် -100… Channel ID နှစ်ခုစလုံး လိုအပ်သည်။ Bot ကို Post Messages permission ဖြင့် Admin ပေးပါ။')}</div><label>Movie Rule</label><select name="movie"><option value="false">OFF</option><option value="true">ON</option></select><p class="hint">Limits: ${p.pair_limit} pairs · ${p.channel_per_pair_limit} channels per pair</p><button type="submit">Check channels and create pair</button></form></div>`}
function renderSettings(){const p=state.data.profile;$('#view').innerHTML=`<div class="card"><h2>${tr('Account settings','အကောင့် Setting')}</h2><p>Telegram ID: <b>${p.telegram_id}</b></p><p>Username: <b>${p.username?'@'+esc(p.username):'—'}</b></p><p>Pair limit: <b>${p.pair_limit}</b></p><p>Channels per pair: <b>${p.channel_per_pair_limit}</b></p><form id="language-form"><label>Language / ဘာသာစကား</label><select name="language"><option value="en" ${p.language==='en'?'selected':''}>English</option><option value="my" ${p.language==='my'?'selected':''}>မြန်မာ</option></select><button>Save language</button></form><div class="actions"><button class="secondary" data-action="help">Help</button>${state.data.contact_admin?`<a href="https://t.me/${esc(state.data.contact_admin.replace(/^@/,''))}" target="_blank" rel="noopener">Contact Admin ${esc(state.data.contact_admin)}</a>`:''}</div></div><div class="card"><h3>Shared data</h3><p class="muted">The Mini App and Bot use the same PostgreSQL data. Removing a pair disables it in both interfaces.</p></div>`}
async function renderAdmin(){ $('#view').innerHTML='<div class="card">Loading admin dashboard…</div>';const d=await api('/api/admin');const s=d.stats,g=d.settings;const users=d.users.map(u=>`<div class="user-row" data-user="${u.telegram_id}"><div class="rowhead"><b>${u.username?'@'+esc(u.username):'User'} · ${u.telegram_id}</b><span class="pill ${u.is_banned?'bad':'ok'}">${u.is_banned?'Banned':'Active'}</span></div><p class="muted">${u.active_pairs} pairs · ${u.channels} channels</p><div class="grid"><div><label>Pair limit (blank / 0 = default)</label><input name="pair_limit" type="number" min="0" value="${u.pair_limit??''}"></div><div><label>Channels per pair (blank / 0 = default)</label><input name="channel_limit" type="number" min="0" value="${u.channel_per_pair_limit??''}"></div></div><div class="actions"><button data-action="save-user" data-id="${u.telegram_id}">Save limits</button><button class="${u.is_banned?'secondary':'danger'}" data-action="ban" data-id="${u.telegram_id}" data-banned="${u.is_banned}">${u.is_banned?'Unban':'Ban'}</button></div></div>`).join('');$('#view').innerHTML=`<h2>Admin Dashboard</h2><div class="stats"><div class="stat"><strong>${s.users}</strong><span class="muted">Users</span></div><div class="stat"><strong>${s.active_pairs}</strong><span class="muted">Pairs</span></div><div class="stat"><strong>${s.channels}</strong><span class="muted">Channels</span></div></div><div class="card"><div class="rowhead"><h3>Global limits</h3><button class="secondary" data-action="status-report">Send report</button></div><form id="global-form"><div class="grid"><div><label>Default pair limit (minimum 1)</label><input name="default_pair_limit" type="number" min="1" value="${g.default_pair_limit}" required></div><div><label>Default channels per pair</label><input name="default_channel_per_pair_limit" type="number" min="1" value="${g.default_channel_per_pair_limit}" required></div></div><label>Total user limit (0 = unlimited)</label><input name="user_limit" type="number" min="0" value="${g.user_limit}" required><button>Save global limits</button></form></div><div class="card"><h3>Users (${d.users.length})</h3>${users||'<p class="muted">No users yet.</p>'}</div>`}
function showTab(tab){if(tab==='admin'&&!state.data.profile.is_admin)return;state.tab=tab;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('secondary',b.dataset.tab!==tab));if(tab==='pairs')renderPairs();else if(tab==='add')renderAdd();else if(tab==='settings')renderSettings();else if(tab==='admin')renderAdmin().catch(e=>notice(e.message,'error'))}
async function refresh(){state.data=await api('/api/bootstrap');const p=state.data.profile;$('#welcome').textContent=p.username?'@'+p.username:`Telegram user ${p.telegram_id}`;$('#role').textContent=p.is_admin?'ADMIN':'USER';document.documentElement.lang=p.language==='my'?'my':'en';const navLabels=p.language==='my'?['ကျွန်ုပ်၏ Pair များ','＋ အသစ်ထည့်','ဆက်တင်','စီမံခန့်ခွဲမှု']:['My Pairs','＋ Add','Settings','Admin'];document.querySelectorAll('#nav [data-tab]').forEach((el,i)=>el.textContent=navLabels[i]);$('#nav').classList.remove('hidden');$('#admin-tab').classList.toggle('hidden',!p.is_admin);showTab(state.tab)}
document.addEventListener('click',async e=>{const tab=e.target.closest('[data-tab]');if(tab){showTab(tab.dataset.tab);return}const a=e.target.closest('[data-action]');if(!a)return;try{const no=a.dataset.no;switch(a.dataset.action){case'delete-pair':if(!confirm(`Remove Pair ${no}?`))return;await api(`/api/pairs/${no}`,{method:'DELETE'});notice('Pair removed.','success');await refresh();break;case'save-pair':{const c=a.closest('[data-pair]'),style=c.querySelector('[name=style]').value,body={repost_style:style,movie_rule:c.querySelector('[name=movie]').value==='true'};if(style==='by_order')body.order=c.querySelector('[name=order]').value.split(',').map(x=>Number(x.trim())).filter(Number.isFinite);await api(`/api/pairs/${no}`,{method:'PUT',body:JSON.stringify(body)});notice('Pair settings saved.','success');await refresh();break}case'recheck':{const d=await api(`/api/pairs/${no}/recheck`,{method:'POST'});notice(d.message,d.pair.is_paused?'error':'success');await refresh();break}case'ban':{const banned=a.dataset.banned!=='true';if(!confirm(`${banned?'Ban':'Unban'} user ${a.dataset.id}?`))return;await api(`/api/admin/users/${a.dataset.id}`,{method:'PATCH',body:JSON.stringify({is_banned:banned})});notice(banned?'User banned.':'User unbanned.','success');await renderAdmin();break}case'save-user':{const r=a.closest('[data-user]'),x=r.querySelector('[name=pair_limit]').value,y=r.querySelector('[name=channel_limit]').value;await api(`/api/admin/users/${a.dataset.id}`,{method:'PATCH',body:JSON.stringify({pair_limit:x===''?null:Number(x),channel_per_pair_limit:y===''?null:Number(y)})});notice('User limits saved.','success');await renderAdmin();break}case'status-report':{const d=await api('/api/admin/status-report',{method:'POST'});notice(d.message,'success');break}case'help':alert(tr('Add the bot as channel administrator and grant Post Messages permission. Public channels accept @username or https://t.me/username. Private channels require invite link and numeric channel ID.','Channel တိုင်းမှာ Bot ကို Admin ထည့်ပြီး Post Messages permission ပေးပါ။ Public Channel အတွက် @username သို့မဟုတ် link သုံးပါ။ Private Channel အတွက် Invite Link နှင့် Channel ID နှစ်ခုလုံးလိုပါတယ်။'));break}}catch(err){notice(err.message,'error')}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;try{if(f.id==='add-form'){const d=new FormData(f);await api('/api/pairs',{method:'POST',body:JSON.stringify({pair_no:d.get('pair_no')||'auto',repost_style:d.get('style'),channels:d.get('channels'),movie_rule:d.get('movie')==='true'})});notice('Pair created and shared with the Bot.','success');await refresh()}else if(f.id==='language-form'){const d=new FormData(f);await api('/api/profile',{method:'PUT',body:JSON.stringify({language:d.get('language')})});notice('Language saved.','success');await refresh()}else if(f.id==='global-form'){const d=new FormData(f);await api('/api/admin/settings',{method:'PATCH',body:JSON.stringify({default_pair_limit:Number(d.get('default_pair_limit')),default_channel_per_pair_limit:Number(d.get('default_channel_per_pair_limit')),user_limit:Number(d.get('user_limit'))})});notice('Global limits saved.','success');await renderAdmin()}}catch(err){notice(err.message,'error')}});
function syncTheme(){if(!tg)return;const p=tg.themeParams||{},r=document.documentElement;for(const [k,v] of [['--bg',p.bg_color],['--panel',p.secondary_bg_color],['--text',p.text_color],['--muted',p.hint_color],['--accent',p.button_color]])if(v)r.style.setProperty(k,v);if(p.bg_color){tg.setHeaderColor?.(p.bg_color);tg.setBackgroundColor?.(p.bg_color)}}
if(tg){tg.ready();tg.expand();syncTheme();tg.onEvent?.('themeChanged',syncTheme)}
if(!tg?.initData)notice('Open this page from the Telegram bot Mini App button. Telegram authentication is required.','error');else refresh().then(()=>notice('Connected securely to Telegram.','success')).catch(err=>notice(err.message,'error'));
})();
</script></body></html>
